PART
{
	name = Telescope_GreatRefractor
	module = Part
	author = WhirligigGirl
	MODEL
	{
		model = WhirligigLocoWorks/Parts/Telescopes/GreatRefractor
	}
	rescaleFactor = 1
	node_stack_bottom = 0.0, -4.855, 0.0,   0.0,-1.0,0.0, 0
	node_stack_top    = 0.0, 5.073, 0.0,    0.0,1.0,0.0,  0
	node_attach       = 0.0, -0.022, 0.396, 0.0,0.0,-1.0, 0
	TechRequired = generalRocketry
	entryCost = 4200
	cost = 5000
	category = Science
	subcategory = 0
	title = Elven-Klarc 20" f/20 Photovisual Great Refractor
	manufacturer = Elven, Klarc, & Co.
	description = The Klarc 20-inch Great Refractor is the largest telescope ever built, and will certainly never be surpassed in light gathering capability. Utilizing a three-element apochromatic lens, it can focus red, green, and ultraviolet light to the same focal point, making it ideal for both photography and visual work. \n\nNote: Photographs can be prepared by any computist, but visual astronomy can only be performed by a trained scientist.
	attachRules = 1,1,1,1,0
	mass = 0.8
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.15
	angularDrag = 2
	crashTolerance = 10
	maxTemp = 2000 // = 2900
	breakingForce = 50
	breakingTorque = 50
	bulkheadProfiles = size0, srf
	tags = telescope astro astronomy refractor great greatrefractor eyepiece photo camera photography astrophotography astrophotograph astrophoto film plate glass lens apochromat 
	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = FilmAstrophoto
